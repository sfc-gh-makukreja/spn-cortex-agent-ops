[project]
name = "spn-cortex-agent-ops"
version = "0.1.0"
description = "Take any Cortex Agent into a dev, test and prod CI/CD flow"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "snowflake-cli>=3.0",
]

[project.scripts]
ops = "ops.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
