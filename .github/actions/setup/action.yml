# uv, then the locked project (snow CLI, ops). To sign in to Snowflake, a job sets
# SNOWFLAKE_AUTHENTICATOR=WORKLOAD_IDENTITY and
# SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER=OIDC; snow then fetches the job's GitHub
# OIDC token itself (needs `id-token: write`).
name: Setup
description: uv sync --locked, with the tools on PATH

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.11.13"
        enable-cache: true
    - shell: bash
      run: |
        uv sync --locked
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
